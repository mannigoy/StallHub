<h1>Edit Profile</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="First Name">
    <input type="email" name="email" value="{{ user.email }}" placeholder="Email">
    <input type="text" name="username" value="{{ user.username }}" placeholder="Username">

    <button type="submit">Update Profile</button>
</form>

<hr>

<form method="POST" action="{% url 'vendors:delete_profile' %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Are you sure you want to delete your account?')">
        Delete Account
    </button>
</form>

<a href="{% url 'vendors:dashboard' %}">← Back to Home</a>
