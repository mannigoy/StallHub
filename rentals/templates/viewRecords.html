<!DOCTYPE html>
<html>
<head>
    <title>View Records</title>
</head>
<body>

<a href="/">← Back to Home</a>
<br><br>

<h1>All Rental Records</h1>

<table border="1">
    <tr>
        <th>Vendor</th>
        <th>Stall</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Status</th>
    </tr>

    {% for record in records %}
    <tr>
        <td>{{ record.vendor }}</td>
        <td>{{ record.stall }}</td>
        <td>{{ record.start_date }}</td>
        <td>{{ record.end_date }}</td>
        <td>{{ record.rental_status }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No records found</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
