<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — StallHub</title>
    <!---
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f5f0e8; min-height: 100vh; }
    nav {
      background: #2d5a3d; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
    }
    .nav-brand { font-family: 'DM Serif Display', serif; font-size: 20px; color: #fff; }
    .nav-links { display: flex; align-items: center; gap: 8px; }
    .nav-links a { color: #d4e8db; text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 6px; transition: background 0.15s; }
    .nav-links a:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .nav-links .btn-logoff { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    main { max-width: 480px; margin: 48px auto; padding: 0 24px; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 30px; color: #1a1a1a; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
    .card { background: #fff; border: 1px solid #e0d9cc; border-radius: 12px; padding: 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; font-family: 'DM Sans', sans-serif; background: #fafafa;
      color: #1a1a1a; transition: border-color 0.2s; margin-bottom: 20px;
    }
    input:focus { outline: none; border-color: #4a7c59; background: #fff; }
    .hint { font-size: 12px; color: #aaa; margin-top: -16px; margin-bottom: 20px; }
    .btn { padding: 11px 28px; background: #2d5a3d; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1e3f2b; }
    .btn-back { padding: 11px 20px; background: transparent; color: #666; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; text-decoration: none; margin-right: 8px; }
    .btn-back:hover { background: #f5f0e8; }
    .success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 20px; }
    .error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 20px; }
  </style>
  -->
</head>
<body>
  <nav>
    <span class="nav-brand">StallHub</span>
    <div class="nav-links">
      <a href="{% url 'users:dashboard' %}">Dashboard</a>
      <a href="{% url 'users:add_record' %}">Add New Record</a>
      <a href="{% url 'users:logoff' %}" class="btn-logoff">Log Off</a>
    </div>
  </nav>
  <main>
    <h1>Edit Profile</h1>
    <p class="subtitle">Update your username or change your password.</p>
    <div class="card">
      {% if success %}
        <div class="success">{{ success }}</div>
      {% endif %}
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ user.username }}" required>

        <label for="password1">New Password</label>
        <input type="password" id="password1" name="password1" placeholder="Leave blank to keep current">
        <p class="hint">Leave blank if you don't want to change your password.</p>

        <label for="password2">Confirm New Password</label>
        <input type="password" id="password2" name="password2" placeholder="Repeat new password">

        <div>
          <a href="{% url 'users:dashboard' %}" class="btn-back">Cancel</a>
          <button type="submit" class="btn">Save Changes</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
