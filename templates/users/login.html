    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Login — StallHub</title>

    </head>
    <body>
      <div class="container">
        <div class="brand">StallHub</div>
        <div class="brand-sub">Market Management System</div>

        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="{{ username|default:'' }}" required autofocus>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>

          <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="footer-link">
          Don't have an account? <a href="{% url 'users:register' %}">Register</a>
        </div>
      </div>
    </body>
    </html>
